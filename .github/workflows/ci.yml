name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: MoonBit 驗證閘（check / build / 定律 / 定理 / 架構）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 MoonBit 正式工具鏈（.moonbit-version 固定）
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 工具鏈版本
        run: moon version --all

      - name: 更新 registry 索引（moonbitlang/async 等依賴解析所需）
        run: moon update

      - name: 靜態檢查（零警告閘）
        run: moon check --deny-warn --target wasm-gc

      - name: Wasm-GC 建置
        run: moon build --target wasm-gc

      - name: 公開介面快照不得過期
        run: |
          moon info --target wasm-gc
          git diff --exit-code -- '**/pkg.generated.mbti' 'pkg.generated.mbti'

      - name: 聯邦功能清單、退役實作及生成文檔不得漂移
        run: python3 tools/federation_docs.py --check

      - name: 定律登記不得過期（gen_laws.py 後工作區必須無差異）
        run: |
          python3 tools/gen_laws.py
          git diff --exit-code -- 'meta/*/laws.mbt'

      - name: 第九聯邦定律總表（631 / 631）
        run: moon run cmd/metatheory --target wasm-gc

      - name: 第十聯邦定律總表（構造性泛代數 × 預層模板 × De Morgan 立方體，167 / 167）
        run: moon run cmd/ualg --target wasm-gc

      - name: Cubical 全量平衡管線（139 / 139；部分執行不能過閘）
        run: |
          set -o pipefail
          python3 tools/run_pipeline.py --jobs=2 --require-full --jsonl | tee _build/pipeline.jsonl

      - name: 保存管線進度及覆蓋證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-pipeline-events
          path: _build/pipeline.jsonl
          if-no-files-found: ignore

      - name: 聯邦驗收（39 active、6 retired、50 證書、15 checker laws）
        run: moon run cmd/showcase --target wasm-gc

      - name: 架構閘（聯邦白名單、分層、零殘留測試）
        run: python3 tools/arch_check.py
